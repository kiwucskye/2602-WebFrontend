<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>11월 2일</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                font-family: "맑은 고딕";
                font-size: 0;
            }
            .box {
                width: 100px;
                height: 100px;
            }
            .red-box {
                background-color: red;
                margin-left: 50px;
            }
            .green-box {
                background-color: green;
                position: relative;
                left: 100px;
                top: -20px;
            }
            .blue-box {
                background-color: blue;
                position: absolute;
                left: 50px;
                top: 20px;
            }
            .yellow-box {
                background-color: yellow;
            }
            .pink-box {
                background-color: pink;
                position: absolute;
                left: 100px;
            }
            .indigo-box {
                background-color: indigo;
            }
         </style>
    </head>
    <body>
        <div class="box red-box"></div>
        <div class="box green-box"></div>
        <div class="box blue-box"></div>
        <div class="box yellow-box"></div>
        <div class="box pink-box"></div>
        <div class="box indigo-box"></div>
    </body>
</html>
