<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>10월 26일 수업</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            .d1 {
                width: 300px;
                height: 200px;
                background-color: pink;
                margin-top: 30px;
                margin-left: 20px;
                margin-bottom: 40px;
                /*border: 1px solid red;*/
                border-width: 2px;
                border-style: solid;
                border-color: blue;
                border-radius: 20px;
                display: inline;
            }
            .d2 {
                width: 300px;
                height: 200px;
                background-color: yellow;
                margin: 20px 30px;
                border: 10px outset red;
                padding: 20px;
            }
            .d3 {
                width: 280px;
                height: 190px;
                background-color: green;
                margin: 20px;
                border-bottom: 2px solid red;
                padding-left: 20px;
                padding-top: 10px;
                display:inline-block;
            }
            .d4 {
                width: 300px;
                height: 200px;
                background-color: aqua;
                padding-left: 30px;
                padding-top: 30px;
                box-sizing: border-box;
                display: inline-block;
            }
            .d4 h1 {
                border-bottom: 2px dotted black;
                width: 80px;
            }
            .d5 {
                width: 300px;
                height: 200px;
                background-color: gray;
                display: none;
            }
            .d5 h1 {
                margin-top: 30px;
                margin-left: 30px;
            }
            .d6 {
                width: 300px;
                height: 200px;
                background-color: gold;
                border: 10px solid red;
                box-sizing: border-box;
            }
            .d6 h1 {
                padding-top: 30px;
                padding-left: 30px;
            }
            .d6 span {
                font-weight: bold;
                background-color: red;
                width: 100px;
                height: 100px;
                padding-left: 20px;
                padding-right: 20px;
                display: inline-block;
            }
        </style>
    </head>
    <body>
        <div class="d1">
            안녕하세요.
        </div>
        <div class="d2">
            최신뉴스
        </div>
        <div class="d3">
            공지사항
        </div>
        <div class="d4">
            <h1>Q&A</h1>
        </div>
        <div class="d5">
            <h1>Q&A</h1>
        </div>
        <div class="d6">
            <h1>Q&A</h1>아<span>아아</span>아아
        </div>
    </body>
</html>
