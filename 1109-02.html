<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>11월 9일 수업</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                font-size: 0;
            }
            header {
                width: 900px;
                height: 100px;
                background-color: gold;
                margin:0 auto;
            }
            footer {
                width: 900px;
                height: 50px;
                background-color: yellow;
                margin:0 auto;
            }
            main {
                width: 900px;
                height: 500px;
                margin:0 auto; /*가운데 정렬*/
            }
            .left {
                width: 200px;
                height: 500px;
                background-color: red;
                display: inline-block;
            }
            .contents {
                width: 500px;
                height: 500px;
                background-color: green;
                display: inline-block;
            }
            .right {
                width: 200px;
                height: 500px;
                background-color: blue;
                display: inline-block;
            }
        </style>
    </head>
    <body>
        <header></header>
        <main>
            <aside class="left"></aside>
            <section class="contents"></section>
            <aside class="right"></aside>
        </main>
        <footer></footer>
    </body>
</html>
