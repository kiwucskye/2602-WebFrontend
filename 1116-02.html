<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>선형 그라데이션</title>
        <style>
            .outer_div {
                width:400px;
                float:left;
                border: 1px solid black;
            }
            .my_gradient_1 {
                background-image: linear-gradient(to bottom, red, yellow);
                width:400px;
                height: 200px;
            }
            .my_gradient_2 {
                background-image: linear-gradient(to top, red, yellow);
                width:400px;
                height: 200px;
            }
            .my_gradient_3 {
                background-image: linear-gradient(to right, red, yellow);
                width:400px;
                height: 200px;
            }
            .my_gradient_4 {
                background-image: linear-gradient(270deg, red, yellow);
                width:400px;
                height:200px;
            }
            .my_gradient_5 {
                background-image: linear-gradient(to right bottom, red, yellow);
                width:400px;
                height:200px;
            }
            .my_gradient_6 {
                background-image: linear-gradient(225deg, red, yellow);
                width:400px;
                height:200px;
            }
            .my_gradient_7 {
                background-image: linear-gradient(to top right, red, yellow);
                width:400px;
                height:200px;
            }
            .my_gradient_8 {
                background-image: linear-gradient(315deg, red, yellow);
                width:400px;
                height:200px;
            }
            .my_gradient_9 {
                background-image: linear-gradient(to right, red, green, blue);
                width:400px;
                height:200px;
            }
            .my_gradient_10 {
                background-image: linear-gradient(to right, red,yellow 10%);
                width:400px;
                height:200px;
            }
        </style>
    </head>
    <body>
        <div class="outer_div">
            <div class="my_gradient_1"></div>
            <P>to bottom, red, yellow</P>
        </div>
        <div class="outer_div">
            <div class="my_gradient_2"></div>
            <P>to top, red, yellow</P>
        </div>
        <div class="outer_div">
            <div class="my_gradient_3"></div>
            <P>to right, red, yellow</P>
        </div>
        <div class="outer_div">
            <div class="my_gradient_4"></div>
            <P>to left, red, yellow</P>
        </div>
        <div class="outer_div">
            <div class="my_gradient_5"></div>
            <P>to right bottom, red, yellow</P>
        </div>
        <div class="outer_div">
            <div class="my_gradient_6"></div>
            <P>to left bottom, red, yellow</P>
        </div>
        <div class="outer_div">
            <div class="my_gradient_7"></div>
            <P>to top right, red, yellow</P>
        </div>
        <div class="outer_div">
            <div class="my_gradient_8"></div>
            <P>to top left, red, yellow</P>
        </div>
        <div class="outer_div">
            <div class="my_gradient_9"></div>
            <P>to right, red, green, blue</P>
        </div>
        <div class="outer_div">
            <div class="my_gradient_10"></div>
            <P>to right, red, yellow 10%</P>
        </div>
    </body>
</html>
