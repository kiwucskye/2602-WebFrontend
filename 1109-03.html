<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>11월 9일 수업</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                font-size: 0;
            }
            .wrap {
                position: relative;
                top: 200px;
                left: 200px;
                width: 300px;
                height: 300px;
                border: 1px solid #ccc
            }
            .box {
                width: 50px;
                height: 50px;
                background-color: indigo;
                position: relative;
            }
            .crd1 {
                top: 0;
                left: 0;
            }
            .crd2 {
                top: -50px;
                left: 250px;
            }
            .crd3 {
                top: 150px;
                left: 0;
            }
            .crd4 {
                top: 100px;
                left: 250px;
            }
            .crd5 {
                top: -75px;
                left: 125px;
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <div class="box crd1"></div>
            <div class="box crd2"></div>
            <div class="box crd3"></div>
            <div class="box crd4"></div>
            <div class="box crd5"></div>
        </div>
    </body>
</html>
