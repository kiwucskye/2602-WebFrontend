<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>선형 그라데이션 실습</title>
        <style>
            .btn {
                width:150px;
                height:40px;
                text-align: center;
                margin-bottom: 20px;
                line-height: 40px;
            }
            .top-left {
                background-image: linear-gradient(to bottom right, transparent 10px,#58a 0);
            }
            .top-right {
                background-image: linear-gradient(to bottom left, transparent 10px, #58a 0);
            }
            .bottom-right {
                background-image: linear-gradient(to top left, transparent 10px, #58a 0);
            }
            .bottom-left {
                background-image: linear-gradient(to top right, transparent 10px, #58a 0);
            }
            .top {
                background: linear-gradient(to bottom right, transparent 10px,#58a 0) left,linear-gradient(to bottom left, transparent 10px, #58a 0) right;
                background-repeat: no-repeat;
                background-size: 50% 100%;
            }
            .bottom {
                background: linear-gradient(to top right, transparent 10px,#58a 0) left,linear-gradient(to top left, transparent 10px, #58a 0) right;
                background-repeat: no-repeat;
                background-size: 50% 100%;
            }
            .a11 {
                background: linear-gradient(135deg, transparent 10px,#58a 0) top left, linear-gradient(-135deg, transparent 10px, #58a 0) bottom right, linear-gradient(to bottom right, transparent 10px,#58a 0) top left, linear-gradient(to top left, transparent 10px, #58a 0) top right;
                background-repeat: no-repeat;
                background-size: 50% 50%;
            }
        </style>
    </head>
    <body>
        <h2>모서리 한개</h2>
        <div class="btn top-left">BUTTON</div>
        <div class="btn top-right">BUTTON</div>
        <div class="btn bottom-right">BUTTON</div>
        <div class="btn bottom-left">BUTTON</div>
        <h2>모서리 두개</h2>
        <div class="btn top">BUTTON</div>
        <div class="btn bottom">BUTTON</div>
        <h2>모서리 여러개</h2>
        <div class="btn a11">BUTTON</div>
        <h2>메뉴</h2>
    </body>
</html>
