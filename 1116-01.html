<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>텍스트 그림자</title>
        <style>
            li {
                font-size: 50px;
                font-family: "arial black";
                background-color: pink;
                width: 250px;
            }
            .text1 {
                color: #06f;
                text-shadow: 3px 3px 5px #000;
            } 
            .text2 {
                color: #c30;
                text-shadow: 3px -3px 5px black;
            }
            .text3 {
                color: #fff;
                text-shadow: 0px 2px 1px rgba(0,0,0,5);
            }
            .text4 {
                color: #000000;
                text-shadow: 0px 2px 1px #ffffff;
            }
            .text5 {
                color:#fff;
                text-shadow: 0px 1px 10px #fff;
            }
            .text6 {
                color: #fff;
                text-shadow: 1px -1px 7px #6f0;
            }
            .text7 {
                color: white;
                text-shadow: 7px -7px 5px #000;
            }
            .text8 {
                color: rgba(255,255,255,1.0);
                text-shadow: 20px 30px 15px #c90; 
            }
            .text9 {
                color: #000;
                text-shadow: 0px -1px 4px #ccc, 0px -5px 4px #ff3, 2px -10px 6px #fd3, 2px -15px 11px #f80, 2px -19px 18px #f20;
            }
        </style>
    </head>
    <body>
        <ul>
            <li>HTML5</li>
            <li class="text1">HTML5</li>
            <li class="text2">HTML5</li>
            <li class="text3">HTML5</li>
            <li class="text4">HTML5</li>
            <li class="text5">HTML5</li>
            <li class="text6">HTML5</li>
            <li class="text7">HTML5</li>
            <li class="text8">HTML5</li>
            <li class="text9">HTML5</li>
        </ul>
    </body>
</html>
